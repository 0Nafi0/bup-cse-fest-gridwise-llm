services:
  - type: web
    name: gridwise-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_API_KEY
        sync: false
